{% load wagtailimages_tags %}
{% if value.title %}<div class="bhead"><h2>{{ value.title }}</h2></div>{% endif %}
<div class="brand-grid">
  {% for logo in value.logos %}<div>{% image logo max-240x96 loading="lazy" %}</div>{% endfor %}
  {% for name in value.names %}<div><span>{{ name }}</span></div>{% endfor %}
</div>
