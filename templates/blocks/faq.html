{% load wagtailcore_tags %}
{% if value.title %}<div class="bhead"><h2>{{ value.title }}</h2></div>{% endif %}
<div class="faq">{% for item in value.items %}<details><summary>{{ item.question }}<i aria-hidden="true"></i></summary><div class="prose">{{ item.answer|richtext }}</div></details>{% endfor %}</div>
