# Animal Planet — /etc/nginx/conf.d/animalplanet.conf
# Included from the http { } block of /etc/nginx/nginx.conf:
#     include /etc/nginx/conf.d/animalplanet.conf;
# Starts as plain HTTP; `certbot --nginx -d animalplanet.uz -d www.animalplanet.uz --redirect`
# then adds the 443 listener, the certificate and the http → https redirect itself.

upstream animalplanet_app {
    server 127.0.0.1:8031;   # docker compose: "127.0.0.1:8031:8000"
    keepalive 8;
}

server {
    listen 80;
    server_name animalplanet.uz www.animalplanet.uz;

    access_log /var/log/nginx/animalplanet.access.log;
    error_log  /var/log/nginx/animalplanet.error.log warn;

    client_max_body_size 20m;          # photos in the CMS, CVs up to 5 MB

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    # uploaded images / documents straight from the host folder (CVs live in /srv/animalplanet/private
    # and are never reachable from here)
    location /media/ {
        alias /srv/animalplanet/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        location ~* \.(html?|php|js|svg)$ { return 403; }   # uploads are images and documents only
    }

    location / {
        # one address for search engines: www → animalplanet.uz
        # (inside location /, so certbot's /.well-known/acme-challenge/ still works for www)
        if ($host = www.animalplanet.uz) {
            return 301 https://animalplanet.uz$request_uri;
        }
        proxy_pass http://animalplanet_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                       # used by the form rate limit
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;                    # Django knows the request was https
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
